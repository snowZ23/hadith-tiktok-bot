<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <title>Hadith Poster</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      direction: rtl;
      background: #f6efe3;
      font-family:
        "Noto Naskh Arabic",
        "Noto Sans Arabic",
        "Amiri",
        Arial,
        sans-serif;
    }

    .poster {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;

      background-image: url("assets/background.png");
      background-size: 1080px 1920px;
      background-repeat: no-repeat;
      background-position: center;
    }

    /* عنوان الصورة */
    .title {
      position: absolute;
      top: 240px;
      left: 220px;
      right: 220px;

      text-align: center;
      color: #5a3417;
      font-size: 68px;
      font-weight: 700;
      line-height: 1.2;
    }

    /* اسم القائل */
    .sayer-box {
      position: absolute;
      top: 390px;
      left: 140px;
      right: 140px;
      height: 100px;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
      text-align: center;
    }

    .sayer {
      width: 100%;
      color: #0f6949;
      font-size: 42px;
      font-weight: 600;
      line-height: 1.45;

      direction: rtl;
      unicode-bidi: plaintext;
      text-align: center;
      white-space: normal;
    }

    /* صندوق الحديث */
    .hadith-box {
      position: absolute;
      top: 545px;
      left: 120px;
      right: 120px;
      height: 640px;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
      text-align: center;
    }

    .hadith {
      width: 100%;
      color: #3d2818;
      font-size: 56px;
      font-weight: 600;
      line-height: 1.85;

      direction: rtl;
      unicode-bidi: plaintext;
      text-align: center;

      white-space: normal;
      word-break: normal;
      overflow-wrap: break-word;
    }

    /* المصدر */
    .reference-box {
      position: absolute;
      top: 1460px;
      left: 170px;
      right: 170px;
      height: 120px;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
      text-align: center;
    }

    .reference {
      width: 100%;
      color: #0f6949;
      font-size: 38px;
      font-weight: 500;
      line-height: 1.5;

      direction: rtl;
      unicode-bidi: plaintext;
      text-align: center;
      white-space: normal;
      overflow-wrap: break-word;
    }

    /* الفوتر */
    .footer {
      position: absolute;
      bottom: 74px;
      left: 240px;
      right: 240px;

      text-align: center;
      color: #755535;
      font-size: 28px;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div class="poster">

    <div class="title">
      حديث اليوم
    </div>

    <div class="sayer-box">
      <div class="sayer" id="sayer">
        رسول الله محمد صلى الله عليه وآله
      </div>
    </div>

    <div class="hadith-box" id="hadithBox">
      <div class="hadith" id="hadith">
        يَا أَبَاذَرٍّ لِيَكُنْ لَكَ فِي كُلِّ شَيْ‌ءٍ نِيَّةٌ حَتَّى فِي النَّوْمِ وَ الْأَكْلِ.
      </div>
    </div>

    <div class="reference-box" id="referenceBox">
      <div class="reference" id="reference">
        بحار الأنوار، ج ٧٤، ص: ٨٤
      </div>
    </div>

    <div class="footer">
      من تطبيق حديث اليوم
    </div>

  </div>

  <script>
    function fitElementByHeight(element, maxHeight, startSize, minSize, step, lineHeightRatio) {
      let size = startSize;
      element.style.fontSize = size + "px";
      element.style.lineHeight = lineHeightRatio;

      while (element.scrollHeight > maxHeight && size > minSize) {
        size -= step;
        element.style.fontSize = size + "px";
      }
    }

    function fitSayer() {
      const el = document.getElementById("sayer");
      fitElementByHeight(el, 95, 42, 28, 2, 1.45);
    }

    function fitReference() {
      const el = document.getElementById("reference");
      fitElementByHeight(el, 110, 38, 26, 1, 1.45);
    }

    function fitHadith() {
      const box = document.getElementById("hadithBox");
      const el = document.getElementById("hadith");
      const text = (el.innerText || "").trim();
      const len = text.length;

      let startSize = 56;
      let minSize = 34;
      let lineHeight = 1.85;

      if (len > 260) {
        startSize = 42;
        lineHeight = 1.65;
      } else if (len > 220) {
        startSize = 46;
        lineHeight = 1.70;
      } else if (len > 180) {
        startSize = 50;
        lineHeight = 1.75;
      } else if (len > 130) {
        startSize = 54;
        lineHeight = 1.80;
      } else {
        startSize = 56;
        lineHeight = 1.85;
      }

      el.style.fontSize = startSize + "px";
      el.style.lineHeight = lineHeight;

      while (el.scrollHeight > box.clientHeight && startSize > minSize) {
        startSize -= 2;
        el.style.fontSize = startSize + "px";
      }

      while (el.scrollHeight > box.clientHeight && lineHeight > 1.45) {
        lineHeight -= 0.05;
        el.style.lineHeight = lineHeight.toFixed(2);
      }
    }

    function centerHadithVertically() {
      const box = document.getElementById("hadithBox");
      const el = document.getElementById("hadith");

      box.style.alignItems = "center";

      if (el.scrollHeight > box.clientHeight * 0.82) {
        box.style.alignItems = "flex-start";
      }
    }

    function initLayout() {
      fitSayer();
      fitReference();
      fitHadith();
      centerHadithVertically();
    }

    window.addEventListener("load", () => {
      setTimeout(initLayout, 150);
    });
  </script>
</body>

</html>
