<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">

  <style>

    /* الخط العربي الأصلي المستخرج من تطبيق حديث اليوم */
    @font-face {
      font-family: "HadithFont";
      src: url("assets/fonts/SA_UthmanTN1_Ver10.ttf") format("truetype");
      font-style: normal;
      font-weight: normal;
      font-display: block;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      direction: rtl;

      font-family:
        "Noto Naskh Arabic",
        "Noto Sans Arabic",
        Arial,
        sans-serif;
    }

    .poster {
      position: relative;

      width: 1080px;
      height: 1920px;

      background-image: url("assets/background.png");
      background-size: 1080px 1920px;
      background-position: center;
      background-repeat: no-repeat;
    }


    /* =========================
       عنوان حديث اليوم
       ========================= */

    .title {
      position: absolute;

      top: 355px;
      left: 220px;
      right: 180px;

      text-align: center;

      color: #573417;

      font-size: 62px;
      font-weight: 700;
      line-height: 1.2;
    }


    /* =========================
       اسم القائل
       ========================= */

    .sayer-box {
      position: absolute;

      top: 470px;
      left: 175px;
      right: 135px;

      height: 105px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .sayer {
      width: 100%;

      text-align: center;
      direction: rtl;
      unicode-bidi: plaintext;

      color: #0d6849;

      font-size: 40px;
      font-weight: 600;
      line-height: 1.35;

      white-space: normal;
    }


    /* =========================
       نص الحديث
       ========================= */

    .hadith-box {
      position: absolute;

      top: 570px;

      /* تحريك الحديث قليلًا إلى اليمين */
      left: 170px;
      right: 100px;

      height: 560px;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .hadith {
      width: 100%;

      /* الخط الأصلي للتطبيق */
      font-family: "HadithFont", "Noto Naskh Arabic", serif;
      font-weight: normal;

      text-align: center;
      direction: rtl;
      unicode-bidi: plaintext;

      color: #3b281b;

      font-size: 55px;
      line-height: 1.75;

      white-space: normal;
      word-break: normal;
      overflow-wrap: normal;
    }


    /* =========================
       المصدر
       ========================= */

    .reference-box {
      position: absolute;

      top: 1450px;
      left: 185px;
      right: 185px;

      height: 120px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .reference {
      width: 100%;

      text-align: center;
      direction: rtl;
      unicode-bidi: isolate;

      color: #0d6849;

      font-size: 37px;
      font-weight: 500;
      line-height: 1.45;

      white-space: normal;
    }


    /* =========================
       الفوتر
       ========================= */

    .footer {
      position: absolute;

      bottom: 28px;
      left: 250px;
      right: 250px;

      text-align: center;

      color: #725131;

      font-size: 24px;
      line-height: 1.3;
    }

  </style>
</head>


<body>

  <div class="poster">

    <div class="title">
      حديث اليوم
    </div>


    <div class="sayer-box">
      <div class="sayer" id="sayer">
        رسول الله محمد صلى الله عليه وآله
      </div>
    </div>


    <div class="hadith-box" id="hadithBox">
      <div class="hadith" id="hadith">
        حَلَالٌ بَيِّنٌ وَ حَرَامٌ بَيِّنٌ وَ شُبُهَاتٌ بَيْنَ ذَلِكَ فَمَنْ تَرَكَ الشُّبُهَاتِ نَجَا مِنَ الْمُحَرَّمَاتِ وَ مَنْ أَخَذَ بِالشُّبُهَاتِ ارْتَكَبَ الْمُحَرَّمَاتِ وَ هَلَكَ مِنْ حَيْثُ لَا يَعْلَمُ.
      </div>
    </div>


    <div class="reference-box" id="referenceBox">
      <div class="reference" id="reference">
        <bdi dir="rtl">الكافي، ج ١، ص: ٦٨</bdi>
      </div>
    </div>


    <div class="footer">
      من تطبيق حديث اليوم
    </div>

  </div>


  <script>

    /*
      تصغير أي عنصر تلقائيًا إذا تجاوز
      المساحة المخصصة له.
    */

    function fitText(
      element,
      maxHeight,
      startSize,
      minSize,
      step
    ) {

      let size = startSize;

      element.style.fontSize =
        size + "px";

      while (
        element.scrollHeight > maxHeight &&
        size > minSize
      ) {

        size -= step;

        element.style.fontSize =
          size + "px";
      }
    }


    /* =========================
       اسم القائل
       ========================= */

    function fitSayer() {

      const el =
        document.getElementById("sayer");

      fitText(
        el,
        100,
        40,
        29,
        1
      );
    }


    /* =========================
       المصدر
       ========================= */

    function fitReference() {

      const el =
        document.getElementById("reference");

      fitText(
        el,
        110,
        37,
        27,
        1
      );
    }


    /* =========================
       الحديث
       ========================= */

    function fitHadith() {

      const box =
        document.getElementById("hadithBox");

      const el =
        document.getElementById("hadith");

      const text =
        (el.innerText || "").trim();

      const length =
        text.length;


      /*
        الحجم الابتدائي يتغير حسب
        طول الحديث.
      */

      let fontSize = 55;
      let lineHeight = 1.75;


      /* حديث قصير جدًا */
      if (length <= 80) {

        fontSize = 62;
        lineHeight = 1.80;
      }

      /* حديث قصير */
      else if (length <= 140) {

        fontSize = 57;
        lineHeight = 1.75;
      }

      /* حديث متوسط */
      else if (length <= 200) {

        fontSize = 52;
        lineHeight = 1.68;
      }

      /* حديث طويل */
      else if (length <= 280) {

        fontSize = 46;
        lineHeight = 1.58;
      }

      /* حديث طويل جدًا */
      else {

        fontSize = 40;
        lineHeight = 1.50;
      }


      el.style.fontSize =
        fontSize + "px";

      el.style.lineHeight =
        lineHeight;


      /*
        إذا بقي النص أكبر من الصندوق
        نصغر الخط تدريجيًا.
      */

      while (
        el.scrollHeight > box.clientHeight &&
        fontSize > 30
      ) {

        fontSize -= 1;

        el.style.fontSize =
          fontSize + "px";
      }


      /*
        إذا لم يكفِ تصغير الخط،
        نقلل تباعد الأسطر تدريجيًا.
      */

      while (
        el.scrollHeight > box.clientHeight &&
        lineHeight > 1.30
      ) {

        lineHeight -= 0.03;

        el.style.lineHeight =
          lineHeight.toFixed(2);
      }


      /*
        الحديث القصير يظهر في منتصف المنطقة.
        الطويل يبدأ من الأعلى لاستغلال المساحة.
      */

      if (
        el.scrollHeight >
        box.clientHeight * 0.72
      ) {

        box.style.alignItems =
          "flex-start";
      }

      else {

        box.style.alignItems =
          "center";
      }
    }


    /* =========================
       بدء التنسيق
       ========================= */

    async function init() {

      /*
        مهم جدًا:
        ننتظر تحميل SA_UthmanTN1
        قبل حساب حجم النص.
      */

      if (document.fonts) {
        await document.fonts.ready;
      }

      fitSayer();
      fitHadith();
      fitReference();
    }


    window.addEventListener(
      "load",
      () => {

        setTimeout(
          init,
          250
        );

      }
    );

  </script>

</body>

</html>
